<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AK Wallet | Cloud Sync & Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #2563eb 100%); }
        .hidden { display: none; }
        #drawer { transition: 0.3s transform ease; transform: translateX(100%); }
        #drawer.active { transform: translateX(0); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div id="authPage" class="fixed inset-0 bg-white z-[150] p-8 overflow-y-auto">
        <div class="text-center mb-10">
            <div class="bg-blue-600 text-white w-16 h-16 rounded-2xl flex items-center justify-center font-bold text-2xl mx-auto">AK</div>
            <h2 id="authTitle" class="text-2xl font-black mt-4">Cloud Login</h2>
        </div>
        <div id="loginForm" class="space-y-4">
            <input type="email" id="lEmail" placeholder="Email" class="w-full p-4 bg-gray-100 rounded-2xl border outline-none">
            <input type="password" id="lPass" placeholder="Password" class="w-full p-4 bg-gray-100 rounded-2xl border outline-none">
            <button onclick="handleLogin()" id="lBtn" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold">Login</button>
            <p class="text-center text-sm">New? <span onclick="toggleAuth(true)" class="text-blue-600 font-bold">Register</span></p>
        </div>
        <div id="regForm" class="space-y-4 hidden">
            <input type="email" id="rEmail" placeholder="Email" class="w-full p-4 bg-gray-100 rounded-2xl border outline-none">
            <input type="text" id="rTg" placeholder="Telegram @username" class="w-full p-4 bg-gray-100 rounded-2xl border outline-none">
            <input type="number" id="rPhone" placeholder="Telegram Phone" class="w-full p-4 bg-gray-100 rounded-2xl border outline-none">
            <input type="password" id="rPass" placeholder="Password" class="w-full p-4 bg-gray-100 rounded-2xl border outline-none">
            <button onclick="handleRegister()" id="rBtn" class="w-full bg-green-600 text-white py-4 rounded-2xl font-bold">Register Now</button>
            <p class="text-center text-sm">Have account? <span onclick="toggleAuth(false)" class="text-blue-600 font-bold">Login</span></p>
        </div>
    </div>

    <div id="mainApp" class="hidden">
        <div class="p-4 flex justify-between items-center bg-white border-b sticky top-0 z-50">
            <h1 class="font-black text-xl italic text-blue-700">AKWALLET</h1>
            <button onclick="toggleDrawer(true)" class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center border"><i class="fa-solid fa-user text-blue-600"></i></button>
        </div>
        <div class="p-4">
            <div class="gradient-bg rounded-[32px] p-8 text-white shadow-2xl">
                <p class="text-[10px] opacity-60 font-bold uppercase tracking-widest">Balance</p>
                <h2 class="text-5xl font-black mt-1">₹ <span id="balDisp">0.00</span></h2>
                <div class="flex gap-4 mt-10">
                    <button onclick="Swal.fire('Deposit', 'Contact Admin to add funds.', 'info')" class="flex-1 bg-white text-blue-700 py-4 rounded-2xl font-black">Add Fund</button>
                    <button onclick="openWithdraw()" class="flex-1 bg-blue-400/20 border border-white/30 py-4 rounded-2xl font-black">Withdraw</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const DATABASE_URL = "https://script.google.com/macros/s/AKfycbyjimXDEwJJSLtvlod06Cp0NDWeUJHQ_1kRPjNEjXnH9jIhqqDmYJoldeFMjV19Q-c/exec";
        const BOT_TOKEN = "8693713409:AAHqW1_dnYN2XeZAr8fzrWFj0jXBrDS9vFA"; //
        const CHAT_ID = "7879390024"; //

        let user = null;

        window.onload = async () => {
            const saved = localStorage.getItem('ak_cloud_session');
            if(saved) {
                user = JSON.parse(saved);
                await refreshData();
                showMain();
            }
        };

        async function handleLogin() {
            const email = document.getElementById('lEmail').value;
            const pass = document.getElementById('lPass').value;
            if(!email || !pass) return;
            try {
                const res = await fetch(DATABASE_URL);
                const users = await res.json();
                const found = users.find(u => u.email === email && String(u.password) === pass);
                if(found) {
                    user = found;
                    localStorage.setItem('ak_cloud_session', JSON.stringify(user));
                    location.reload();
                } else { Swal.fire('Error', 'Invalid Details', 'error'); }
            } catch(e) { Swal.fire('Error', 'Server Error', 'error'); }
        }

        async function handleRegister() {
            const regData = {
                action: "register",
                email: document.getElementById('rEmail').value,
                password: document.getElementById('rPass').value,
                tg_user: document.getElementById('rTg').value,
                tg_phone: document.getElementById('rPhone').value
            };
            try {
                const res = await fetch(DATABASE_URL, { method: 'POST', body: JSON.stringify(regData) });
                const text = await res.text();
                if(text === "Success") { Swal.fire('Success', 'Account Created!', 'success').then(() => location.reload()); }
                else { Swal.fire('Error', 'User exists', 'error'); }
            } catch(e) { Swal.fire('Error', 'Failed', 'error'); }
        }

        async function openWithdraw() {
            const { value: formValues } = await Swal.fire({
                title: 'Withdrawal',
                html: '<input id="w-upi" class="swal2-input" placeholder="UPI ID"><input id="w-amt" type="number" class="swal2-input" placeholder="Amount">',
                preConfirm: () => { return { upi: document.getElementById('w-upi').value, amt: document.getElementById('w-amt').value } }
            });

            if (formValues) {
                const amt = parseFloat(formValues.amt);
                if (amt > user.balance || amt <= 0) return Swal.fire('Error', 'Check Balance', 'error');

                // Telegram Message
                const msg = `💸 *Withdraw Request*\n\n📧 Email: ${user.email}\n💰 Amt: ₹${amt}\n🆔 UPI: ${formValues.upi}`;
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`);
                
                Swal.fire('Success', 'Request sent to Admin!', 'success');
            }
        }

        async function refreshData() {
            const res = await fetch(DATABASE_URL);
            const users = await res.json();
            const latest = users.find(u => u.email === user.email);
            if(latest) { user = latest; document.getElementById('balDisp').innerText = parseFloat(user.balance).toFixed(2); }
        }

        function showMain() { document.getElementById('authPage').classList.add('hidden'); document.getElementById('mainApp').classList.remove('hidden'); }
        function toggleAuth(isReg) { document.getElementById('loginForm').classList.toggle('hidden', isReg); document.getElementById('regForm').classList.toggle('hidden', !isReg); }
        function toggleDrawer(show) { document.getElementById('drawer').classList.toggle('active', show); }
        function logout() { localStorage.removeItem('ak_cloud_session'); location.reload(); }
    </script>
</body>
</html>
